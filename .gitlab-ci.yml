# GitLab Pages — static site deployment
pages:
  stage: deploy
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r . public/
    - rm -rf public/.git public/.gitlab-ci.yml
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment:
    name: production
    url: https://v1zer09.gitlab.io/dota2-master/
